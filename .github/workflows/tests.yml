name: Tests

# The GUT suite on every branch and every PR. deploy.yml runs the same command
# as a gate before exporting, so main/staging can't ship a red suite; this
# workflow is what tells you BEFORE you open the PR.

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gut:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.1 # must match Godot version in CLAUDE.md / project.godot
    env:
      GODOT_VERSION: "4.6.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same template shuffle as deploy.yml — the image ships them under /root
      # and Godot looks under the invoking user's home.
      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      # A fresh checkout has no .godot/ cache, so class_name scripts are unknown
      # to a headless run until the project is imported once. Without this the
      # suite fails to even parse. First import can emit transient errors.
      - name: Import resources
        run: godot --headless --import || true

      # .gutconfig.json sets should_exit, so the runner quits with a non-zero
      # code on any failure and this step is the gate.
      - name: Run GUT
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd
