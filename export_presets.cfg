; The profiling build. Identical to "Web" in every way that affects frame cost —
; same renderer, same thread setting, same RELEASE templates — so what it measures
; is what ships. The ONLY difference is custom_features="profiling", which
; web_profile_boot.gd checks before it will look at the URL query string. Without
; that feature the profiler is unreachable, which is what keeps ?profile inert on
; the live site.
;
; It exports to build/web-profile/, NOT docs/. docs/index.pck is tracked (see the
; !docs/index.pck whitelist in .gitignore), and a profiling pck must never be
; committable by accident.
;
; Export with:  mkdir -p build/web-profile          (Godot will not create it)
;               godot --path . --headless --export-release "Web Profile"
; Then drive:   python scripts/tools/run_web_profile.py
;
; Keep exclude_filter identical to preset.0's. build/* is in there because a web
; export writes PNG icons next to its pck, and anything under res:// gets
; imported back into the NEXT export — measured at 14 stray files bundled before
; the filter was added.

[preset.1]

name="Web Profile"
platform="Web"
runnable=true
dedicated_server=false
custom_features="profiling"
export_filter="all_resources"
include_filter=""
exclude_filter="addons/gut/*,tests/*,assets/screenshots/*,assets/audio_all/*,docs/*,build/*,preview_out/*,sim_out/*,.gutconfig.json"
export_path="build/web-profile/index.html"
patches=PackedStringArray()
patch_delta_encoding=false
patch_delta_compression_level_zstd=19
patch_delta_min_reduction=0.1
patch_delta_include_filters="*"
patch_delta_exclude_filters=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
